name: Update profile summary cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-summary-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Refresh available cards
        run: |
          base_url="https://github-profile-summary-cards.vercel.app/api/cards"
          output_dir="profile-summary-card-output/nord_dark"
          mkdir -p "$output_dir"

          refresh_card() {
            endpoint="$1"
            destination="$2"
            extra_query="${3:-}"
            temporary_file="$(mktemp)"

            if curl --fail --location --silent --show-error \
              --retry 3 --max-time 60 \
              "$base_url/$endpoint?username=CambridgeZ&theme=nord_dark$extra_query" \
              --output "$temporary_file" && \
              ! grep --quiet --extended-regexp \
                "ERROR!!!|temporarily rate limited|Something went wrong" \
                "$temporary_file"; then
              mv "$temporary_file" "$output_dir/$destination"
            else
              rm -f "$temporary_file"
              echo "Keeping the last valid $destination"
            fi
          }

          refresh_card profile-details 0-profile-details.svg
          refresh_card repos-per-language 1-repos-per-language.svg
          refresh_card most-commit-language 2-most-commit-language.svg
          refresh_card stats 3-stats.svg
          refresh_card productive-time 4-productive-time.svg "&utcOffset=8"

          # Keep the long profile organization label clear of the chart.
          sed -i \
            's/University of Science and Technology of China/USTC/g' \
            "$output_dir/0-profile-details.svg"

      - name: Commit refreshed cards
        run: |
          git add profile-summary-card-output
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile summary cards"
          git push
